<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>考试答题卡上传</title>
<style>
  html, body { margin: 0; height: 100%; }
  body {
    background: #f5f0e8;
    color: #4a3a20;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    display: flex; align-items: center; justify-content: center;
    -webkit-text-size-adjust: 100%;
  }
  .box { text-align: center; padding: 24px; }
  .dot {
    width: 26px; height: 26px; margin: 0 auto 14px;
    border: 2.5px solid #e0d0b0; border-top-color: #8a6a30;
    border-radius: 50%; animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .tip { font-size: 14px; color: #6a5a3a; }
  a { color: #8a6a30; font-size: 14px; }
</style>
</head>
<body>
<div class="box">
  <div class="dot"></div>
  <div class="tip">正在打开…</div>
</div>
<script>
/* 这一页只做跳转，不承载任何上传逻辑，也不要有表单。
   正式上传页是 React 那套（ExamParent + ExamUpload），入口 /?page=exam。
   两个入口最终都走同一套代码，不要再在这里复制 JSX 或另写一份表单。 */
(function () {
  try {
    location.replace("/?page=exam");
  } catch (e) {
    document.querySelector(".box").innerHTML = '<a href="/?page=exam">点这里进入</a>';
  }
})();
</script>
<noscript><div class="box"><a href="/?page=exam">点这里进入</a></div></noscript>
</body>
</html>
